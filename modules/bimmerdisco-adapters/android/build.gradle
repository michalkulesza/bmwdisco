plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.bimmerdiscoadapters'
version = '0.1.0'

repositories { maven { url 'https://jitpack.io' } }
dependencies { implementation 'com.github.mik3y:usb-serial-for-android:3.11.0' }

android {
  namespace "expo.modules.bimmerdiscoadapters"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}
